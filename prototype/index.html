.det{display:flex;flex-direction:column;gap:8px}

.streaknum{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:46px;font-weight:800;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}

.fab:hover{background:#256A42}

<body>
<div id="app"></div>
<script>
(function () {
'use strict';

/* ================= DATA ================= */
var LEVELS = ['', 'Beginner', 'Home cook', 'Chef'];
var LEVEL_DESC = ['', 'Basic recipes', 'Two-pan recipes', 'Chef techniques'];
var GOALS = {
  mant: { kcal: 2200, p: 110, c: 250, f: 70 },
  musc: { kcal: 2600, p: 140, c: 300, f: 80 },
  def: { kcal: 1800, p: 110, c: 180, f: 60 }

function model() {
  var s = S, lvl = lvlOf(s.xp), goals = GOALS[s.goal], names = {};
  s.fridge.forEach(function (i) { names[i.n] = true; });
  var blocked = s.diet === 'veg' ? MEAT : (s.diet === 'vegan' ? MEAT.concat(ANIMAL) : []);
  var dietOk = function (r) { return !r.ing.some(function (i) { return blocked.indexOf(i.n) >= 0; }); };
  var vm = function (r) {
    var miss = r.ing.filter(function (i) { return !names[i.n]; });
    var fav = !!s.favs[r.id];
    return {
      r: r, name: r.name, tint: r.tint, time: r.time + ' min', levelName: LEVELS[r.level],
      missCount: miss.length, has: !miss.length,
      matchText: miss.length ? 'Missing: ' + miss.map(function (m) { return m.n.toLowerCase(); }).join(', ') : 'You have everything in your fridge',
      locked: r.level > lvl, fav: fav
    };
  };
  var start = s.cooked[TODAY] ? TODAY : TODAY - 1, streak = 0;
  for (var d = start; d > 0 && s.cooked[d]; d--) streak++;
  var best = 0, run = 0;
  for (var d2 = 1; d2 <= 30; d2++) { if (s.cooked[d2]) { run++; if (run > best) best = run; } else run = 0; }
  return { lvl: lvl, goals: goals, names: names, dietOk: dietOk, vm: vm, streak: streak, best: best };
}

  var home = RECIPES.filter(function (r) { return r.level <= M.lvl && r.id !== lastId && M.dietOk(r); })
    .map(M.vm).sort(function (a, b) { return a.missCount - b.missCount; }).slice(0, 6);
  var rot = S.cooked[TODAY]
    ? 'You already made ' + lowerFirst(lastName) + ' today. To keep things varied, we will not suggest it again.'
    : 'Yesterday you made ' + lowerFirst(lastName) + ', so today we suggest something different.';
  return '<section aria-labelledby="h-home"><div class="hero"><div>' +
    '<p class="eyebrow">Friday, 13 November</p><h1 id="h-home">What are we cooking today, Alex?</h1>' +
    '<p class="sub">Recipes you can make with the ' + S.fridge.length + ' ingredients in your fridge.</p></div>' +
    '<button class="pill" ' + on(function () { go('calendar', { calSel: TODAY }); }) + '>' + ic('flame') + M.streak + '-day streak</button></div>' +
    '<div class="note">' + ic('rotate', 'i s') + '<span>' + esc(rot) + '</span></div>' +
    '<div class="grid">' + home.map(function (v) { return card(v); }).join('') + '</div>' +
    '<div class="legend"><span>' + ic('star', 'i s', 'fill:#B07800;color:#B07800') + 'You have every ingredient</span><span>' + ic('star', 'i s', 'color:#B07800') + 'Something is missing</span>' +
    '<span>' + ic('egg', 'i s') + 'Protein</span><span>' + ic('cube', 'i s') + 'Carbs</span><span>' + ic('drop', 'i s') + 'Fat</span></div></section>';
}

function viewScan(M) {
  var selCount = DETECTED.filter(function (d) { return S.scanSel[d.id]; }).length;
  var vf = !S.scanned
    ? '<p class="vfh">' + (S.scanMode === 'fridge' ? 'Open the fridge and frame the shelves.' : 'Hold the receipt straight and in good light.') + '</p>' +
      '<button class="shutter" aria-label="Take photo" ' + on(function () { set({ scanned: true, scanSel: { d1: true, d2: true, d3: true, d4: true } }); }) + '>' + ic('camera') + '</button>' +
      '<p style="font-size:14px;color:#C9D3CC">Tap to take the photo</p>'
    : '<span class="ok-ring">' + ic('check') + '</span><p class="vfh">Photo ready. We found ' + DETECTED.length + ' items.</p>' +
      '<button class="btn" style="background:transparent;color:#fff;border-color:#fff" ' + on(function () { set({ scanned: false }); }) + '>Retake photo</button>';
  var side = !S.scanned
    ? '<p style="color:#5B665E;font-size:15px">After you take the photo, you will see what we recognised here. Confirm with one tap before it goes into your fridge.</p>'
    : '<div class="det">' + DETECTED.map(function (d) {
        var sel = !!S.scanSel[d.id];
        return '<button class="detitem' + (sel ? ' on' : '') + '" aria-pressed="' + sel + '" ' + on(function () { var x = Object.assign({}, S.scanSel); x[d.id] = !x[d.id]; set({ scanSel: x }); }) + '>' +
          '<span class="box">' + ic('check', 'i s') + '</span><span>' + esc(d.n) + '<small>' + (M.names[d.n] ? 'Already in your fridge' : d.info) + '</small></span></button>';
      }).join('') + '</div>' +
      '<div style="margin-top:16px"><button class="btn primary big" style="width:100%" ' + (selCount ? '' : 'disabled ') + on(function () {
        var have = {};
        S.fridge.forEach(function (i) { have[i.n] = true; });
        var add = DETECTED.filter(function (d) { return S.scanSel[d.id] && !have[d.n]; }).map(function (d) { return Object.assign({}, d); });
        go('fridge', { fridge: S.fridge.concat(add), scanned: false, prev: 'home' });
        say(add.length ? 'We added ' + add.length + ' items to your fridge' : 'Those items were already in your fridge');
      }) + '>' + (selCount ? 'Add ' + selCount + (selCount === 1 ? ' item' : ' items') + ' to the fridge' : 'Choose at least one item') + '</button></div>';
  return '<section aria-labelledby="h-scan">' + backBtn() +
    '<div class="headrow"><div><h1 id="h-scan">Fill your fridge</h1><p class="sub">Take a photo and FoodAI recognises what you have.</p></div>' +
    '<div class="seg" role="group" aria-label="What are you scanning">' +
      '<button class="' + (S.scanMode === 'fridge' ? 'on' : '') + '" aria-pressed="' + (S.scanMode === 'fridge') + '" ' + on(function () { set({ scanMode: 'fridge', scanned: false }); }) + '>Fridge</button>' +
      '<button class="' + (S.scanMode === 'receipt' ? 'on' : '') + '" aria-pressed="' + (S.scanMode === 'receipt') + '" ' + on(function () { set({ scanMode: 'receipt', scanned: false }); }) + '>Receipt</button>' +
    '</div></div>' +
    '<div class="split"><div class="main"><div class="viewfinder"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>' + vf + '</div></div>' +
    '<div class="side"><div class="panel"><h2>Items found</h2>' + side + '</div></div></div></section>';
}

function viewDetail(M) {
  var r = findRecipe(S.recipeId), v = M.vm(r), por = S.portions;
  var ing = r.ing.map(function (i) {
    var have = !!M.names[i.n];
    return '<li class="' + (have ? 'have' : 'miss') + '"><span>' + esc(i.n) + '</span><span class="q">' + (i.q ? (i.q * por) + ' ' + (i.q * por === 1 ? 'pc' : 'pcs') : '') + '</span><span class="tag">' + (have ? 'In your fridge' : 'Missing') + '</span></li>';
  }).join('');
  return '<section aria-labelledby="h-detail">' + backBtn() + '<div class="detail"><div class="dcol">' +
    '<div class="bigph" style="background:' + r.tint + '">' + DISH + '<span class="star"><svg class="i" viewBox="0 0 24 24" role="img" aria-label="' + (v.has ? 'You have every ingredient' : 'Some ingredients are missing') + '" style="fill:' + (v.has ? 'currentColor' : 'none') + '">' + P.star + '</svg></span></div>' +
    '<div class="panel"><h2>Ingredients</h2><ul class="ing">' + ing + '</ul>' +
    (v.missCount ? '<div style="margin-top:14px"><button class="btn" ' + on(function () {
      var shop = Object.assign({}, S.shop);
      r.ing.forEach(function (i) { if (!M.names[i.n]) shop[i.n] = true; });
      S.shop = shop;
      say('The missing items are on your shopping list');
    }) + '>' + ic('cart') + 'Add what\'s missing to shopping</button></div>' : '') +
    '</div></div><div class="dcol">' +
    '<div class="dhead"><div><p class="eyebrow">Recipe · ' + r.steps.length + ' steps</p><h1 id="h-detail">' + esc(r.name) + '</h1>' +
      '<div class="meta" style="margin-top:10px;font-size:15px"><span>' + ic('clock', 'i s') + v.time + '</span><span>' + ic('hat', 'i s') + v.levelName + ' level</span></div></div>' +
      heartBtn(v, 'position:static;flex:none;width:52px;height:52px') + '</div>' +
    '<p class="match ' + (v.has ? 'ok' : 'warn') + '" style="font-size:15px">' + esc(v.matchText) + '</p>' +
    '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span style="font-weight:600">Servings</span><div class="stepper">' +
      '<button aria-label="One serving less" ' + on(function () { set({ portions: Math.max(1, S.portions - 1) }); }) + '>' + ic('minus') + '</button>' +
      '<output aria-live="polite">' + por + (por === 1 ? ' serving' : ' servings') + '</output>' +
      '<button aria-label="One serving more" ' + on(function () { set({ portions: Math.min(6, S.portions + 1) }); }) + '>' + ic('plus') + '</button></div></div>' +
    (S.tracker ? '<div class="mbox"><div class="m"><span>Energy</span><b>' + r.kcal * por + '</b><span>kcal</span></div>' +
      '<div class="m"><span>' + ic('egg', 'i s') + 'Protein</span><b>' + r.p * por + ' g</b></div>' +
      '<div class="m"><span>' + ic('cube', 'i s') + 'Carbs</span><b>' + r.c * por + ' g</b></div>' +
      '<div class="m"><span>' + ic('drop', 'i s') + 'Fat</span><b>' + r.f * por + ' g</b></div></div>' : '') +
    '<div class="panel"><h2>How to make it</h2><ol style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45">' +
      r.steps.map(function (st) { return '<li>' + esc(st.s) + '</li>'; }).join('') + '</ol></div>' +
    (v.locked
      ? '<div class="lockmsg">' + ic('lock') + '<span>This recipe unlocks at the <b>' + v.levelName + '</b> level. Keep cooking to level up.</span></div>'
      : '<button class="btn primary big" ' + on(function () { go('cook', { step: 0, timeLeft: r.steps[0].t || 0 }); }) + '>' + ic('pot') + 'Start cooking</button>') +
    '</div></div></section>';
}

function viewCook() {
  var r = findRecipe(S.recipeId), st = r.steps[S.step], full = st.t || 0;
  var last = S.step === r.steps.length - 1;
  var pct = Math.round((S.step + 1) / r.steps.length * 100);
  var tBtn = S.running ? 'Pause' : (S.timeLeft === 0 ? 'Start again' : (S.timeLeft === full ? 'Start' : 'Resume'));
  return '<section aria-labelledby="h-cook">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">' +
      '<button class="btn ghost" ' + on(function () { go('detail', { prev: S.prev }); }) + '>' + ic('x') + 'Exit</button>' +
      '<p style="font-weight:600;color:#5B665E">Step ' + (S.step + 1) + ' of ' + r.steps.length + '</p></div>' +
    '<h1 id="h-cook" style="margin-top:8px;font-size:30px">' + esc(r.name) + '</h1>' +
    '<div class="progress" role="progressbar" aria-label="Recipe progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><div style="width:' + pct + '%"></div></div>' +
    '<div class="cook"><div class="stepcard"><p class="stepnum">Step ' + (S.step + 1) + '</p><p class="steptext" aria-live="polite">' + esc(st.s) + '</p>' +
    (st.t ? '<div class="timer"><span class="tl">' + ic('timer', 'i s') + 'Kitchen timer</span><span class="t' + (S.running ? ' run' : '') + '" role="timer">' + fmt(S.timeLeft) + '</span>' +
      '<button class="btn dark" ' + on(toggleTimer) + '>' + tBtn + '</button><button class="btn ghost" ' + on(resetTimer) + '>Reset</button></div>' : '') +
    '<div class="stepnav"><button class="btn" ' + (S.step === 0 ? 'disabled ' : '') + on(function () { if (S.step > 0) setStep(S.step - 1); }) + '>' + ic('back') + 'Previous</button>' +
    (last
      ? '<button class="btn primary big" ' + on(finish) + '>' + ic('check') + 'Finished! It\'s ready</button>'
      : '<button class="btn primary big" ' + on(function () { setStep(S.step + 1); }) + '>Done, next step' + ic('next') + '</button>') +
    '</div></div>' +
    '<div class="panel"><h2>Step list</h2><ol class="checklist">' + r.steps.map(function (x, i) {
      var cls = i < S.step ? 'citem done' : (i === S.step ? 'citem current' : 'citem');
      return '<li><button class="' + cls + '"' + (i === S.step ? ' aria-current="step"' : '') + ' ' + on(function () { setStep(i); }) + '><span class="circ">' + (i < S.step ? '✓' : '') + '</span><span>' + esc(x.s) + '</span></button></li>';
    }).join('') + '</ol><p style="margin-top:14px;font-size:14px;color:#5B665E">When you finish, we remove what you used from your fridge.</p></div></div></section>';
}

function viewFridge(M) {
  var byExp = function (a, b) { return (a.exp || 99) - (b.exp || 99); };
  var groups = [{ title: 'Basics · always at home', items: S.fridge.filter(function (i) { return i.star; }) }]
    .concat(GROUPS.map(function (g) { return { title: g[1], items: S.fridge.filter(function (i) { return !i.star && i.cat === g[0]; }) }; }))
    .filter(function (g) { return g.items.length; });
  var expCount = S.fridge.filter(function (i) { return i.exp != null && i.exp <= 2; }).length;
  var item = function (it) {
    var exp = it.exp != null && it.exp <= 2;
    return '<div class="item' + (exp ? ' exp' : '') + '"><div class="row"><b>' + esc(it.n) + '</b><span class="tools">' +
      '<button class="mini' + (it.star ? ' staron' : '') + '" aria-pressed="' + !!it.star + '" aria-label="' + (it.star ? 'Remove ' + esc(it.n) + ' from your basics' : 'Mark ' + esc(it.n) + ' as a basic') + '" ' +
        on(function () { set({ fridge: S.fridge.map(function (x) { return x.id === it.id ? Object.assign({}, x, { star: !x.star }) : x; }) }); }) + '>' + ic('star', 'i', 'fill:' + (it.star ? 'currentColor' : 'none')) + '</button>' +
      '<button class="mini" aria-label="Remove ' + esc(it.n) + ' from the fridge" ' + on(function () { S.fridge = S.fridge.filter(function (x) { return x.id !== it.id; }); say(it.n + ' is no longer in your fridge'); }) + '>' + ic('trash') + '</button>' +
      '</span></div><span class="qty">' + esc(it.count ? it.count + ' ' + it.unit : (it.txt || '')) + '</span>' +
      (exp ? '<span class="expb">' + (it.exp === 1 ? 'Expires tomorrow' : 'Expires in ' + it.exp + ' days') + '</span>' : '') + '</div>';
  };
  var sugg = [], seen = {};
  S.fridge.forEach(function (it) {
    if (!it.star && it.count && it.low && it.count <= it.low) { sugg.push({ n: it.n, why: 'Only ' + it.count + ' ' + it.unit + ' left' }); seen[it.n] = true; }
  });
  RECIPES.forEach(function (rr) {
    if (!M.dietOk(rr)) return;
    rr.ing.forEach(function (i) { if (!M.names[i.n] && !seen[i.n]) { seen[i.n] = true; sugg.push({ n: i.n, why: 'To make ' + lowerFirst(rr.name) }); } });
  });
  var shop = sugg.slice(0, 8).map(function (x) {
    var inList = !!S.shop[x.n];
    return '<li><span class="txt"><b>' + esc(x.n) + '</b><span>' + esc(x.why) + '</span></span><button class="addb' + (inList ? ' on' : '') + '" aria-pressed="' + inList + '" ' +
      on(function () { var sh = Object.assign({}, S.shop); if (sh[x.n]) delete sh[x.n]; else sh[x.n] = true; set({ shop: sh }); }) + '>' + (inList ? 'On the list' : 'Add') + '</button></li>';
  }).join('');
  return '<section aria-labelledby="h-fridge"><div class="headrow"><div><h1 id="h-fridge">Your fridge</h1><p class="sub">' + S.fridge.length + ' ingredients · ' + expCount + ' expiring soon</p></div>' +
    '<div class="actions"><button class="btn" ' + on(function () { go('scan', { scanned: false }); }) + '>' + ic('camera') + 'Scan</button>' +
    '<button class="btn primary" ' + on(function () { go('home'); }) + '>' + ic('pot') + 'What can I cook?</button></div></div>' +
    '<div class="split"><div class="main">' + groups.map(function (g) {
      return '<div class="ghead"><h2>' + g.title + '</h2><span class="count">' + g.items.length + '</span></div><div class="items">' + g.items.slice().sort(byExp).map(item).join('') + '</div>';
    }).join('') +
    '<p style="margin-top:18px;font-size:14px;color:#5B665E;display:flex;gap:8px;align-items:center">' + ic('star', 'i s', 'fill:#B07800;color:#B07800') + 'Star the things you always have (oil, salt, rice…). These basics are not removed when you cook.</p></div>' +
    '<aside class="side"><div class="panel"><h2 style="display:flex;align-items:center;gap:10px">' + ic('cart') + 'Shopping suggestions</h2>' +
    '<p style="font-size:14px;color:#5B665E;margin:-6px 0 14px">What you\'re running out of and what you need for new recipes.</p><ul class="shop">' + shop + '</ul>' +
    '<p style="margin-top:14px;font-weight:600">On your list: ' + Object.keys(S.shop).length + ' items</p></div></aside></div></section>';
}

function viewCal(M) {
  var cells = '';
  for (var b = 0; b < 6; b++) cells += '<span></span>';
  for (var day = 1; day <= 30; day++) {
    (function (dn) {
      var ck = !!S.cooked[dn], cls = 'day';
      if (ck) cls += ' cooked';
      if (dn > TODAY) cls += ' future';
      if (dn === TODAY) cls += ' today';
      if (dn === S.calSel) cls += ' sel';
      cells += '<button class="' + cls + '" aria-pressed="' + (dn === S.calSel) + '" aria-label="' + dn + ' November' + (dn === TODAY ? ', today' : '') + (ck ? ', you cooked ' + esc(findRecipe(S.cooked[dn]).name) : '') + '" ' +
        on(function () { set({ calSel: dn }); }) + '><span>' + dn + '</span>' + (ck ? ic('flame') : '') + '</button>';
    })(day);
  }
  var sel = S.calSel, selId = S.cooked[sel], info;
  if (selId) info = '<h2>' + esc(findRecipe(selId).name) + '</h2><p style="color:#5B665E;font-size:15px;margin-bottom:14px">You cooked this recipe on this day.</p><button class="btn" ' + on(function () { go('detail', { recipeId: selId, portions: 1 }); }) + '>Make it again</button>';
  else if (sel === TODAY) info = '<h2>You haven\'t cooked yet today</h2><p style="color:#5B665E;font-size:15px;margin-bottom:14px">Cook something today to keep your streak growing.</p><button class="btn primary" ' + on(function () { go('home'); }) + '>See possible recipes</button>';
  else if (sel < TODAY) info = '<h2>No cooking this day</h2><p style="color:#5B665E;font-size:15px">No problem: what matters is getting back in the kitchen.</p>';
  else info = '<h2>This day hasn\'t come yet</h2><p style="color:#5B665E;font-size:15px">What you cook will show up here.</p>';
  var distinct = {};
  Object.keys(S.cooked).forEach(function (k) { distinct[S.cooked[k]] = true; });
  return '<section aria-labelledby="h-cal"><div class="headrow"><div><h1 id="h-cal">Your streak</h1><p class="sub">The days you cooked and what you made.</p></div></div>' +
    '<div class="split"><div class="main"><div class="streakcard"><span class="flamebig">' + ic('flame') + '</span>' +
    '<div style="flex:1 1 200px"><p class="streaknum">' + M.streak + ' days</p><p style="font-weight:600;color:#7A3A06;margin-top:4px">' +
      (S.cooked[TODAY] ? 'You already cooked today! Come back tomorrow to keep it going.' : 'Cook today to reach ' + (M.streak + 1) + ' days.') + '</p></div>' +
    (S.cooked[TODAY] ? '' : '<button class="btn dark" ' + on(function () { go('home'); }) + '>Cook today</button>') + '</div>' +
    '<div class="panel" style="margin-top:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="margin:0">November 2026</h2><span class="count">' + Object.keys(S.cooked).length + ' days cooking</span></div>' +
    '<div class="cal"><span class="dow">M</span><span class="dow">T</span><span class="dow">W</span><span class="dow">T</span><span class="dow">F</span><span class="dow">S</span><span class="dow">S</span>' + cells + '</div></div></div>' +
    '<aside class="side"><div class="panel"><p class="eyebrow">' + DOW[(sel - 1) % 7] + ', ' + sel + ' November</p>' + info +
    '<div style="margin-top:18px"><div class="stat"><span>Current streak</span><b>' + M.streak + ' days</b></div><div class="stat"><span>Best streak this month</span><b>' + M.best + ' days</b></div><div class="stat"><span>Different recipes</span><b>' + Object.keys(distinct).length + '</b></div></div>' +
    '</div></aside></div></section>';
}

function viewDiscover(M) {
  var q = norm(S.q.trim());
  var results = RECIPES.filter(M.dietOk)
    .filter(function (r) { return !q || norm(r.name).indexOf(q) >= 0 || r.ing.some(function (i) { return norm(i.n).indexOf(q) >= 0; }); })
    .filter(function (r) { return !S.f.prot || r.p >= 25; })
    .filter(function (r) { return !S.f.lowc || r.c <= 35; })
    .filter(function (r) { return !S.f.quick || r.time <= 20; })
    .filter(function (r) { return !S.lvl || r.level === S.lvl; })
    .map(M.vm)
    .filter(function (v) { return !S.f.have || v.missCount === 0; });
  var toggleF = function (k) { return function () { var f = Object.assign({}, S.f); f[k] = !f[k]; set({ f: f }); }; };
  return '<section aria-labelledby="h-disc"><div class="headrow"><div><h1 id="h-disc">Discover new recipes</h1><p class="sub">Search by dish or ingredient and filter by macros, time or level.</p></div></div>' +
    '<label class="search">' + ic('search') + '<span class="sr">Search recipes</span><input id="search" type="search" placeholder="E.g. eggs, chickpeas, chicken…" value="' + esc(S.q) + '"></label>' +
    '<div class="chips" aria-label="Quick searches">' + ['Eggs', 'Chicken', 'Rice', 'Chickpeas', 'Zucchini'].map(function (w) {
      return '<button class="chip" ' + on(function () { set({ q: w }); }) + '>' + w + '</button>';
    }).join('') + '</div>' +
    '<p class="flabel">Macros and time</p><div class="chips">' +
      chip('High protein', S.f.prot, toggleF('prot')) + chip('Low carb', S.f.lowc, toggleF('lowc')) +
      chip('20 min or less', S.f.quick, toggleF('quick')) + chip('Only what I have', S.f.have, toggleF('have')) + '</div>' +
    '<p class="flabel">Level</p><div class="chips">' + [0, 1, 2, 3].map(function (n) {
      return chip(n ? LEVELS[n] : 'All', S.lvl === n, function () { set({ lvl: n }); });
    }).join('') + '</div>' +
    '<p style="margin:22px 0 14px;font-weight:600" aria-live="polite">' + results.length + (results.length === 1 ? ' recipe' : ' recipes') + '</p>' +
    (results.length ? '' : '<div class="empty">' + ic('search', 'i', 'width:34px;height:34px') + '<p>No recipes match those filters. Try removing one.</p><button class="btn" ' +
      on(function () { set({ q: '', lvl: 0, f: { prot: false, lowc: false, quick: false, have: false } }); }) + '>Clear filters</button></div>') +
    '<div class="grid">' + results.map(function (v) { return card(v); }).join('') + '</div></section>';
}

function viewFavs(M) {
  var list = RECIPES.filter(function (r) { return S.favs[r.id]; }).map(M.vm);
  return '<section aria-labelledby="h-favs"><div class="headrow"><div><h1 id="h-favs">Your favourites</h1><p class="sub">Your cookbook: the dishes that turned out well and you want to make again.</p></div></div>' +
    (list.length ? '' : '<div class="empty">' + ic('heart', 'i', 'width:34px;height:34px') + '<p>You don\'t have any favourites yet. Tap the heart on a recipe to save it here.</p><button class="btn" ' + on(function () { go('discover'); }) + '>Discover recipes</button></div>') +
    '<div class="grid">' + list.map(function (v) { return card(v, { noMacros: true }); }).join('') + '</div>' +
    '<div class="panel" style="margin-top:26px"><h2 style="display:flex;align-items:center;gap:10px">' + ic('star', 'i', 'fill:#B07800;color:#B07800') + 'Your everyday basics</h2>' +
    '<p style="font-size:14px;color:#5B665E;margin:-6px 0 12px">What you always have at home. Change them from the fridge.</p><div class="chips">' +
    S.fridge.filter(function (i) { return i.star; }).map(function (i) { return '<span class="chip" style="cursor:default">' + esc(i.n) + '</span>'; }).join('') + '</div></div></section>';
}

function viewProfile(M) {
  var lvl = M.lvl, g = M.goals;
  var lvlPct = lvl === 1 ? Math.round(S.xp / 200 * 100) : (lvl === 2 ? Math.round((S.xp - 200) / 300 * 100) : 100);
  var nextAt = lvl === 1 ? 200 : 500;
  var pct = function (v, goal) { return Math.min(100, Math.round(v / goal * 100)); };
  var mrow = function (icon, label, val, goal, color) {
    return '<div class="mrow"><div class="lab"><span>' + ic(icon, 'i s') + label + '</span><b>' + val + ' / ' + goal + ' g</b></div><div class="bar"><div style="width:' + pct(val, goal) + '%;background:' + color + '"></div></div></div>';
  };
  var week = [['M', 1980], ['T', 2140], ['W', 1860], ['T', 2050], ['F', S.today.kcal, true], ['S', 0], ['S', 0]].map(function (w) {
    var h = Math.max(w[1] ? 6 : 2, Math.round(Math.min(w[1], 3000) / 3000 * 120));
    return '<div class="wcol"><span class="wval">' + (w[1] || '') + '</span><div class="wbar' + (w[2] ? ' today' : '') + '" style="height:' + h + 'px"></div><span class="wlab">' + w[0] + '</span></div>';
  }).join('');
  var chipSet = function (defs, key) { return defs.map(function (d) { return chip(d[1], S[key] === d[0], function () { var o = {}; o[key] = d[0]; set(o); }); }).join(''); };
  return '<section aria-labelledby="h-prof"><div class="headrow" style="align-items:center"><div style="display:flex;align-items:center;gap:16px"><span class="avatar" aria-hidden="true">A</span>' +
    '<div><h1 id="h-prof">Alex</h1><p class="sub" style="margin-top:4px">Student · lives alone · cooks for one</p></div></div>' +
    '<button class="pill" ' + on(function () { go('calendar', { calSel: TODAY }); }) + '>' + ic('flame') + M.streak + '-day streak</button></div>' +
    '<div class="pgrid"><div class="panel"><div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">' + ic('hat', 'i', 'width:34px;height:34px') +
      '<div><p class="eyebrow" style="margin:0">Your cooking level</p><h2 style="margin:0">' + LEVELS[lvl] + '</h2></div><span class="count" style="margin-left:auto">' + S.xp + ' points</span></div>' +
      '<div class="bar" style="margin-top:14px" role="progressbar" aria-label="Progress to the next level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + lvlPct + '"><div style="width:' + lvlPct + '%;background:#2E7D4F"></div></div>' +
      '<p style="margin-top:8px;font-size:14px;color:#5B665E">' + (lvl < 3 ? (nextAt - S.xp) + ' more points to reach ' + LEVELS[lvl + 1] + '.' : 'You reached the top level. You are a chef!') + '</p>' +
      '<div class="lvls">' + [1, 2, 3].map(function (n) {
        return '<div class="lv' + (n < lvl ? ' done' : (n === lvl ? ' cur' : '')) + '"><span>' + LEVELS[n] + '</span><small>' + (n < lvl ? 'Completed' : (n === lvl ? 'Your level · ' : 'Locked · ') + LEVEL_DESC[n]) + '</small></div>';
      }).join('') + '</div>' +
      '<p style="margin-top:14px;font-size:14px;color:#5B665E">Every recipe you finish earns points. When you level up, harder recipes unlock.</p></div>' +
    '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2 style="margin:0">Today\'s macros</h2><span class="count">' + S.today.kcal + ' / ' + g.kcal + ' kcal</span></div>' +
      (S.tracker
        ? mrow('egg', 'Protein', S.today.p, g.p, '#2E7D4F') + mrow('cube', 'Carbs', S.today.c, g.c, '#B5520B') + mrow('drop', 'Fat', S.today.f, g.f, '#3B6EA8') +
          '<p class="flabel" style="margin-top:22px">This week (kcal)</p><div class="week">' + week + '</div>'
        : '<p style="margin-top:14px;color:#5B665E;font-size:15px">The macro tracker is off. Turn it on below if you want to follow what you eat.</p>') + '</div>' +
    '<div class="panel"><h2>Your diet</h2><div class="chips">' + chipSet([['omni', 'I eat everything'], ['veg', 'Vegetarian'], ['vegan', 'Vegan']], 'diet') + '</div>' +
      '<p style="margin-top:10px;font-size:14px;color:#5B665E">We only suggest recipes that fit your diet.</p></div>' +
    '<div class="panel"><h2>Your goal</h2><div class="chips">' + chipSet([['mant', 'Maintain'], ['musc', 'Build muscle'], ['def', 'Lose weight']], 'goal') + '</div>' +
      '<p style="margin-top:10px;font-size:14px;color:#5B665E">Daily target: ' + g.kcal + ' kcal · ' + g.p + ' g protein · ' + g.c + ' g carbs · ' + g.f + ' g fat</p>' +
      '<button class="setrow" style="margin-top:14px" aria-pressed="' + S.tracker + '" ' + on(function () { set({ tracker: !S.tracker }); }) + '><span>Macro tracker<small>Shows protein, carbs and fat on every recipe</small></span><span class="switch' + (S.tracker ? ' on' : '') + '" aria-hidden="true"><i></i></span></button></div>' +
    '</div></section>';
}

/* ================= RENDER ================= */
var app = document.getElementById('app');
function render() {
  var ae = document.activeElement;
  var keepSearch = ae && ae.id === 'search' ? [ae.selectionStart, ae.selectionEnd] : null;
  H = [];
  var M = model();
  var views = { home: viewHome, scan: viewScan, detail: viewDetail, cook: viewCook, fridge: viewFridge, calendar: viewCal, discover: viewDiscover, favs: viewFavs, profile: viewProfile };
  var body = (views[S.view] || viewHome)(M);
  var fab = (S.view !== 'scan' && S.view !== 'cook')
    ? '<button class="fab" aria-label="Scan ingredients with the camera" ' + on(function () { go('scan', { scanned: false }); }) + '>' + ic('camera') + '</button>' : '';
  var toast = S.toast ? '<div class="toast" role="status">' + ic('check', 'i s') + esc(S.toast) + '</div>' : '';
  app.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column">' + header(M) + '<main class="wrap" style="width:100%">' + body + '</main>' + fab + toast + '</div>';
  if (keepSearch) {
    var s = document.getElementById('search');
    if (s) { s.focus(); s.setSelectionRange(keepSearch[0], keepSearch[1]); }
  }
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  var fn = H[+el.getAttribute('data-a')];
  if (fn) fn();
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'search') set({ q: e.target.value });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.menuOpen) set({ menuOpen: false });
});

render();
})();
</script>
</body>
</html>
